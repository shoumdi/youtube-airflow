
name: utube_ci

on:
  push:
   branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: pull repo
        uses: actions/checkout@v4
      
      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10'
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: run tests
        run: pytest youtube-airflow/tests/
